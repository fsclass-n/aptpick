# =============================================================
# Backend (FastAPI) · AI — 테스트 검증 → Render 자동 배포 → Health Check
# - Render 배포는 Render GitHub 연동 Auto-Deploy(render.yaml autoDeployTrigger=checksPass)가 수행 (Deploy Hook 미사용)
#   → 이 워크플로의 verify 가 실패하면 Render 는 배포하지 않습니다.
# - push 시에는 검증만 수행: Render 가 '모든 체크 완료'를 기다리므로 같은 실행에서 배포 완료를 기다리면 교착 상태가 됨
# - 배포 상태 확인(health)은 schedule / 수동 실행으로 운영 서버의 /api/health 와 배포 커밋을 점검
# =============================================================
name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "ai/**", ".github/workflows/deploy-backend.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["backend/**", "ai/**", ".github/workflows/deploy-backend.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend & AI tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: AI module tests
        run: python -m pytest -q ai/tests
      - name: Docker build (backend)
        run: docker build -t aptpick-api:ci backend

  health:
    name: Render backend health check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check https://aptpick-api.onrender.com/api/health
        run: |
          url=https://aptpick-api.onrender.com/api/health
          for i in $(seq 1 12); do   # Render 무료 플랜 콜드 스타트(최대 1분) 대비 재시도
            if body=$(curl -fsS --max-time 30 "$url"); then
              echo "$body"
              commit=$(echo "$body" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit",""))')
              echo "### Render backend: OK" >> "$GITHUB_STEP_SUMMARY"
              echo "- 배포 커밋: \`${commit:-unknown}\` / main HEAD: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i failed; retrying"; sleep 10
          done
          echo "::error::$url 응답 없음 — Render 대시보드의 Deploy/Logs 를 확인하세요 (Blueprint 연결 여부 포함)"
          exit 1
